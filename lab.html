<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Minotaur — character lab</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f17;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #view{position:fixed;inset:0;display:block;width:100%;height:100%}
  #ui{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 24px)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button{background:#232838;color:#eee;border:1px solid #3a4258;border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer}
  button.on{background:#c9a03a;color:#1a1208;border-color:#e8c060;font-weight:600}
  #info{background:rgba(0,0,0,.55);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;max-width:420px}
  body.shot #ui{display:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <div class="row" id="chars"></div>
  <div class="row" id="tiers"></div>
  <div class="row" id="opts"></div>
  <div id="info"></div>
</div>
<script type="module" src="/src/lab.ts"></script>
</body>
</html>
